name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checkov:
    name: Checkov — Policy as Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          # Fail on HIGH and CRITICAL only — MEDIUM/LOW are warnings
          soft_fail_on: LOW,MEDIUM
          skip_check: >-
            CKV_AWS_18,
            CKV_AWS_144,
            CKV_AWS_21,
            CKV2_AWS_19,
            CKV_AWS_117,
            CKV_AWS_272
          # CKV_AWS_18: S3 access logging (optional for non-audit buckets)
          # CKV_AWS_144: S3 cross-region replication (optional)
          # CKV_AWS_21: dev environment intentionally disables S3 versioning for cost; prod always enables it
          # CKV2_AWS_19: known false positive — this EIP is attached to a NAT Gateway, not an EC2 instance
          # CKV_AWS_117: Lambda-in-VPC is opt-in via lambda_subnet_ids — not every event-driven Lambda needs VPC egress
          # CKV_AWS_272: code signing is opt-in via lambda_code_signing_config_arn — requires a caller-managed AWS Signer pipeline

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  tfsec:
    name: tfsec — Terraform Security Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true
          format: default
          additional_args: --exclude-downloaded-modules

  cost-estimate:
    name: Infracost — Cost Estimation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost estimate
        run: |
          infracost breakdown \
            --path environments/prod \
            --format json \
            --out-file /tmp/infracost.json

      - name: Post cost to PR
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost.json
          behavior: update
